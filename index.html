<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>MYOS Platform - IOT Technologies</title>
    <meta name="description" content="Plataforma MYOS — Soluciones en Innovación para su negocio con Cerebro Digital IA y flujo de aprobación humana centralizada." />
    <meta property="og:title" content="MYOS Platform - IOT Technologies" />
    <meta property="og:description" content="Plataforma MYOS — Soluciones en Innovación para su negocio con Cerebro Digital IA y flujo de aprobación humana centralizada." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script>
      // Ignorar advertencias inofensivas de websocket en entorno de vista previa
      const origError = console.error;
      console.error = function(...args) {
        if (args.some(a => typeof a === 'string' && (a.includes('[vite]') || a.includes('WebSocket')))) {
          return;
        }
        origError.apply(console, args);
      };
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && String(event.reason.message || event.reason).includes('WebSocket')) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
